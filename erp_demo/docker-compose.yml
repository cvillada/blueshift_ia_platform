# Postgres de exemplo para o conector ERP (BlueShift demo)
# Sobe um banco isolado com schema ERP + dados fictícios de demonstração.
# Usuário/senha/db fixos para facilitar o exemplo local.
services:
  erp_pg:
    image: postgres:16-alpine
    container_name: blueshift_erp_demo
    environment:
      POSTGRES_USER: blueshift
      POSTGRES_PASSWORD: blueshift
      POSTGRES_DB: erp_demo
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - erp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueshift -d erp_demo"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  erp_pg_data:
