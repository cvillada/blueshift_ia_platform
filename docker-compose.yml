# BlueShift IA Platform — Installer de cliente (on-premise)
#
# Sobe a plataforma completa em um unico container:
#   - License Server (mock, porta 9000)
#   - Update Channel (mock, porta 9001)
#   - Portal do Cliente (Camada 4, porta definida em PORTAL_PORT)
#
# IMPORTANTE (modelos de IA): a plataforma NAO embute nenhum modelo.
# O cliente cadastra os proprios na tela "Modelos IA" do Portal:
#   - Local/servidor interno: vLLM, LM Studio, Ollama (base_url interna, sem api_key)
#   - Externo: DeepSeek, OpenRouter, OpenAI, Claude (base_url + api_key)
# Cada AGENTE define qual modelo usa.
#
# Uso:
#   cp .env.example .env   # edite BLUESHIFT_LICENSE e as portas
#   ./install.sh           # ou: docker compose up -d --build

services:
  blueshift:
    image: blueshift/platform:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: blueshift-platform
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    environment:
      TZ: "America/Sao_Paulo"
      BLUESHIFT_AREAS: "vendas,suporte,financeiro,rh,operacoes"
      # Chave da sessao do portal: FIXA (se nao, cada rebuild gera uma nova
      # e TODAS as sessoes morrem — usuario logado cai com 302 no proximo
      # clique). Trocar em producao e manter estavel entre deploys.
      BLUESHIFT_PORTAL_SECRET: "${BLUESHIFT_PORTAL_SECRET:-bs-portal-secret-troque-em-producao}"
      # Chave de ativacao emitida pela BlueShift (cadastro da empresa).
      # VAZIA = plataforma nao ativada (a tela Atualizacoes orienta a
      # solicitacao). NUNCA usar BS-DEV-* em producao (so valem com DEV=1).
      BLUESHIFT_LICENSE: "${BLUESHIFT_LICENSE:-}"
      BLUESHIFT_LICENSE_URL: "${BLUESHIFT_LICENSE_URL:-http://localhost:9000/v1/validate}"
      BLUESHIFT_LICENSE_PORT: "9000"
      BLUESHIFT_UPDATE_URL: "${BLUESHIFT_UPDATE_URL:-http://localhost:9001/v1/channel}"
      BLUESHIFT_UPDATE_PORT: "9001"
      BLUESHIFT_DEV: "${BLUESHIFT_DEV:-0}"
      # Seed demo (1 = cria dados de exemplo XPTO; 0 = banco limpo — o cliente
      # cadastra a propria empresa na tela Clientes). Usar 0 em instalacao final.
      BLUESHIFT_SEED_DEMO: "${BLUESHIFT_SEED_DEMO:-1}"
      # Modelo de ROTEAMENTO dos conectores (qual IA escolhe a ferramenta certa).
      # Padrao (vazio): usa o modelo principal de cada agente. Recomendado:
      # um modelo local rapido (id 2 = hermes-3-llama-3.1-8b) — custo ~0.
      BLUESHIFT_ROUTER_MODEL: "${BLUESHIFT_ROUTER_MODEL:-2}"
    # Sobrescreve o CMD default (blueshift status) para subir o Portal do Cliente
    command: ["blueshift", "portal"]
    volumes:
      # SQLite do portal + memoria/conhecimento do cliente (persiste entre reinicios)
      - blueshift-data:/opt/blueshift/data
      # Modelos fine-tuned / locais do cliente (se usar vLLM interno montado)
      - blueshift-models:/opt/blueshift/models
      # Update via Git (A4): clone fixo do repo (le versao + checkout da tag)
      # + docker.sock do host (o portal dispara o rebuild por ele).
      # Default "." = o proprio diretorio do compose (dev: o projeto local;
      # producao: clone em /opt/blueshift/repo). BLUESHIFT_REPO_DIR sobrescreve.
      # O DOCUMENTACAO_PB.md (popup Ajuda + tela Docs) e lido de dentro do
      # repo montado — fonte unica, sem bind de arquivo separado.
      - ${BLUESHIFT_REPO_DIR:-.}:/opt/blueshift/repo
      - /var/run/docker.sock:/var/run/docker.sock

  # Gateway OpenAI-compativel — chats externos (Open WebUI, LibreChat, apps)
  # falam o protocolo padrao /v1/chat/completions e o gateway repassa ao
  # agente via API do canal (token). Configurado/ativado na tela Gateway
  # do portal. Sobe junto com a plataforma (mesma imagem, mesmo volume).
  gateway:
    image: blueshift/platform:latest
    container_name: blueshift-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-9003}:9003"
    environment:
      BLUESHIFT_PORTAL_DB: "/opt/blueshift/data/portal.db"
      GATEWAY_PORTAL_URL: "http://blueshift-platform:8080"
    command: ["blueshift", "gateway", "--port", "9003"]
    volumes:
      - blueshift-data:/opt/blueshift/data
    depends_on:
      - blueshift

volumes:
  blueshift-data:
  blueshift-models:
