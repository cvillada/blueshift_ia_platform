<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueShift — Grafo de Dependências</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100vh}
#topbar{height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;background:linear-gradient(90deg,#0e1830,#101a33);border-bottom:1px solid #1e293b;position:fixed;top:0;left:0;right:0;z-index:10}
#topbar h1{font-size:1rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#topbar .sub{color:#64748b;font-size:.75rem;border-left:1px solid #1e293b;padding-left:12px}
#legend{position:fixed;bottom:20px;left:20px;background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:10px;padding:12px 16px;z-index:10;font-size:.75rem}
#legend h3{color:#94a3b8;font-size:.6875rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.leg-row{display:flex;align-items:center;gap:8px;margin:3px 0;color:#94a3b8;font-size:.6875rem}
.leg-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
#container{position:fixed;top:52px;left:0;right:0;bottom:0}
#tooltip{position:fixed;background:rgba(15,23,42,.95);border:1px solid #38bdf8;border-radius:8px;padding:10px 14px;z-index:20;display:none;pointer-events:none;max-width:280px;font-size:.75rem;line-height:1.5}
#tooltip strong{color:#e2e8f0}
#tooltip span{color:#94a3b8}
#tooltip .path{color:#64748b;font-family:monospace;font-size:.6875rem;margin-top:4px}
</style>
</head>
<body>

<div id="topbar">
  <h1>🔷 BlueShift IA Platform</h1>
  <div class="sub">Grafo de dependências — arraste os nós para explorar</div>
</div>

<div id="legend">
  <h3>categorias</h3>
  <div class="leg-row"><div class="leg-dot" style="background:#38bdf8"></div> Portal</div>
  <div class="leg-row"><div class="leg-dot" style="background:#818cf8"></div> Core</div>
  <div class="leg-row"><div class="leg-dot" style="background:#34d399"></div> Connector</div>
  <div class="leg-row"><div class="leg-dot" style="background:#fbbf24"></div> CLI</div>
  <div class="leg-row"><div class="leg-dot" style="background:#fb7185"></div> Infra</div>
  <div class="leg-row" style="margin-top:6px;border-top:1px solid #1e293b;padding-top:6px">
    <svg width="30" height="4"><line x1="0" y1="2" x2="30" y2="2" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/></svg>
    <span style="color:#64748b">depende de</span>
  </div>
</div>

<div id="container"></div>
<div id="tooltip"></div>

<script>
const nodes = new vis.DataSet([
  // --- PORTAL ---
  {id:"views",    label:"views.py",         group:"portal",    title:"Rotas e telas do Portal",    path:"portal/views.py"},
  {id:"templates",label:"templates.py",      group:"portal",    title:"Layout HTML/CSS/JS",          path:"portal/templates.py"},

  // --- CORE ---
  {id:"db",       label:"db.py",            group:"core",      title:"SQLite — ponto único de dados",path:"portal/db.py"},
  {id:"auth",     label:"auth.py",           group:"core",      title:"Autenticação e RBAC",         path:"portal/auth.py"},
  {id:"memory",   label:"memory.py",         group:"core",      title:"RAG — TF-IDF + cosseno",      path:"portal/memory.py"},
  {id:"llm",      label:"llm_client.py",     group:"core",      title:"LLM OpenAI-compatible",       path:"portal/llm_client.py"},
  {id:"agente",   label:"agente.py",         group:"core",      title:"Orquestrador do agente",      path:"portal/agente.py"},
  {id:"sso",      label:"sso.py",            group:"core",      title:"Login federado OIDC",         path:"portal/sso.py"},

  // --- CONNECTOR ---
  {id:"registry", label:"registry.py",       group:"connector", title:"Engine API/MCP/SQL",           path:"connector_pack/registry.py"},
  {id:"mcp_srv",  label:"mcp_server.py",     group:"connector", title:"MCP stdio server",            path:"connector_pack/mcp_server.py"},
  {id:"mcp_erp",  label:"mcp_erp.py",        group:"connector", title:"Conector ERP (Postgres)",     path:"connector_pack/mcp_erp.py"},
  {id:"mcp_crm",  label:"mcp_crm.py",        group:"connector", title:"Conector CRM (exemplo)",      path:"connector_pack/mcp_crm.py"},
  {id:"mcp_rh",   label:"mcp_rh.py",         group:"connector", title:"Conector RH (exemplo)",       path:"connector_pack/mcp_rh.py"},

  // --- CLI ---
  {id:"cli",      label:"cli.py",            group:"cli",       title:"Entry point 'blueshift'",     path:"cli.py"},
  {id:"license",  label:"license_client.py", group:"cli",       title:"Valida license key",          path:"license_client.py"},
  {id:"installer",label:"installer.py",       group:"cli",       title:"Cria perfil do cliente",      path:"installer.py"},
  {id:"update",   label:"update_client.py",  group:"cli",       title:"Update Channel",              path:"update_client.py"},

  // --- INFRA ---
  {id:"docker",   label:"Dockerfile",        group:"infra",     title:"Imagem do container",         path:"docker/Dockerfile"},
]);

const edges = new vis.DataSet([
  // views → dependências
  {from:"views", to:"db"},
  {from:"views", to:"auth"},
  {from:"views", to:"templates"},
  {from:"views", to:"memory"},
  {from:"views", to:"agente"},
  {from:"views", to:"sso"},

  // agente → dependências
  {from:"agente", to:"db"},
  {from:"agente", to:"memory"},
  {from:"agente", to:"llm"},
  {from:"agente", to:"registry"},

  // auth → db
  {from:"auth", to:"db"},

  // memory → db
  {from:"memory", to:"db"},

  // sso → db
  {from:"sso", to:"db"},

  // registry → db
  {from:"registry", to:"db"},

  // mcp_server → registry + conectores
  {from:"mcp_srv", to:"registry"},
  {from:"mcp_srv", to:"mcp_erp"},
  {from:"mcp_srv", to:"mcp_crm"},
  {from:"mcp_srv", to:"mcp_rh"},

  // CLI → dependências
  {from:"cli", to:"license"},
  {from:"cli", to:"installer"},
  {from:"cli", to:"update"},
  {from:"cli", to:"views"},
  {from:"cli", to:"mcp_srv"},
]);

const groups = {
  portal:    {color:{background:"#1e3a5f",border:"#38bdf8",highlight:{background:"#2563eb",border:"#60a5fa"}}, font:{color:"#38bdf8",size:12}},
  core:      {color:{background:"#1e1b4b",border:"#818cf8",highlight:{background:"#3730a3",border:"#a5b4fc"}}, font:{color:"#818cf8",size:12}},
  connector: {color:{background:"#064e3b",border:"#34d399",highlight:{background:"#047857",border:"#6ee7b7"}}, font:{color:"#34d399",size:12}},
  cli:       {color:{background:"#451a03",border:"#fbbf24",highlight:{background:"#78350f",border:"#fcd34d"}}, font:{color:"#fbbf24",size:12}},
  infra:     {color:{background:"#4c0519",border:"#fb7185",highlight:{background:"#881337",border:"#fda4af"}}, font:{color:"#fb7185",size:12}},
};

const options = {
  physics:{enabled:true,solver:"forceAtlas2Based",forceAtlas2Based:{gravitationalConstant:-40,centralGravity:.005,springLength:180,springConstant:.02,damping:.4}},
  layout:{improvedLayout:true},
  edges:{
    arrows:{to:{enabled:true,scaleFactor:.6}},
    color:{color:"#475569",highlight:"#38bdf8",hover:"#38bdf8"},
    smooth:{type:"curvedCW",roundness:.15},
    width:1.2,
    dashes:true,
  },
  nodes:{
    shape:"box",
    borderWidth:1.5,
    borderRadius:6,
    margin:{top:8,right:14,bottom:8,left:14},
    font:{face:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif",size:12},
    shadow:{enabled:true,size:4},
  },
  interaction:{
    hover:true,
    tooltipDelay:200,
    navigationButtons:true,
    keyboard:true,
  },
  manipulation:{enabled:false},
};

const container = document.getElementById("container");
const network = new vis.Network(container, {nodes,edges}, options);

// Tooltip customizado
let tooltipTimer;
network.on("hoverNode", function(params){
  clearTimeout(tooltipTimer);
  const node = nodes.get(params.node);
  const el = document.getElementById("tooltip");
  el.innerHTML = `<strong>${node.label}</strong><br><span>${node.title}</span><div class="path">${node.path}</div>`;
  el.style.display = "block";
  el.style.left = (params.event.clientX + 15) + "px";
  el.style.top = (params.event.clientY + 15) + "px";
});
network.on("blurNode", function(){
  tooltipTimer = setTimeout(() => {
    document.getElementById("tooltip").style.display = "none";
  }, 300);
});
network.on("dragEnd", function(){network.fit();});
</script>
</body>
</html>
