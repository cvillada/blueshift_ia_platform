[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueshift-layer"
version = "0.9.8"
description = "BlueShift IA Platform — Flask standalone, on-premise, Docker + license key"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "flask>=3.1",
    "mcp>=1.0",
    "psycopg[binary]>=3.1",
    "PyMuPDF>=1.28",
    "pymysql>=1.1",
    "pymssql>=2.3",
    "oracledb>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
blueshift = "blueshift_layer.cli:main"

[tool.setuptools]
packages = ["blueshift_layer", "blueshift_layer.portal", "blueshift_layer.connector_pack", "blueshift_layer.template_skills"]
